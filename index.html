<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f4f0">
    <title>HalloWorld</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f3f4f0;
        color: #173f35;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        place-items: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 12vw, 7rem);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HalloWorld</h1>
    </main>
  </body>
</html>
